<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקת Truecaller</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #eef2f0; color: #111b21; margin: 0; padding: 20px 16px; }
  @media (prefers-color-scheme: dark) { body { background: #0b141a; color: #e9edef; } .btn { background: #111b21 !important; border-color: #23313a !important; } input { background: #111b21; color: inherit; } }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #667781; font-size: 14px; margin: 0 0 16px; }
  input { width: 100%; box-sizing: border-box; font-size: 20px; padding: 12px; border-radius: 12px; border: 1px solid #ccc; direction: ltr; margin-bottom: 16px; }
  .btn { display: block; width: 100%; box-sizing: border-box; text-align: right; padding: 14px 16px; margin-bottom: 10px; border-radius: 14px; border: 1px solid #e3e8e6; background: #fff; color: inherit; font-size: 16px; text-decoration: none; }
  .btn b { display: inline-block; min-width: 28px; color: #008069; }
  .btn small { display: block; color: #667781; font-size: 12px; margin-top: 2px; direction: ltr; text-align: right; word-break: break-all; }
</style>
</head>
<body>
  <h1>בדיקת Truecaller</h1>
  <p>לחץ על כל אפשרות ותגיד לי מה קרה בכל אחת: האפליקציה נפתחה? נפתחה עם המספר? הופיעה שגיאה? כל לחיצה גם מעתיקה את המספר ללוח.</p>
  <input id="n" type="tel" value="+972527654321">
  <div id="list"></div>
<script>
  const variants = [
    ['1', 'פתיחת האפליקציה בלבד', (n) => 'truecaller://'],
    ['2', 'חיפוש, צורה א', (n) => `truecaller://search?q=${encodeURIComponent(n)}`],
    ['3', 'חיפוש, צורה ב', (n) => `truecaller://search/${encodeURIComponent(n)}`],
    ['4', 'חיפוש, צורה ג', (n) => `truecaller://search?number=${encodeURIComponent(n)}`],
    ['5', 'פרופיל', (n) => `https://www.truecaller.com/userProfile?number=${encodeURIComponent(n)}`],
    ['6', 'האתר (המצב הנוכחי)', (n) => `https://www.truecaller.com/search/il/${n.replace(/^\+972/, '')}`],
  ];
  const list = document.getElementById('list');
  const input = document.getElementById('n');
  function draw() {
    list.innerHTML = '';
    variants.forEach(([id, label, fn]) => {
      const a = document.createElement('a');
      a.className = 'btn';
      a.href = fn(input.value.trim());
      a.innerHTML = `<b>${id}</b>${label}<small>${a.href}</small>`;
      a.addEventListener('click', () => { try { navigator.clipboard.writeText(input.value.trim()); } catch (e) {} });
      list.appendChild(a);
    });
  }
  input.addEventListener('input', draw);
  draw();
</script>
</body>
</html>
